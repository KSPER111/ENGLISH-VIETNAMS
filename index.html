<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGo Clone - Nauka Słówek</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .app-container { width: 100%; max-width: 650px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .hidden { display: none !important; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 1.2rem; font-weight: 800; color: #818cf8; }
        
        /* Progress */
        .progress-box { margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 10px; background: var(--bg); border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.3s ease; }

        /* Buttons & Inputs */
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; font-size: 1rem; }
        .btn:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--border); }
        .btn-success { background: var(--secondary); }
        .btn-danger { background: var(--danger); }
        
        .input-field { width: 100%; padding: 14px; background: var(--bg); border: 2px solid var(--border); border-radius: 10px; color: white; font-size: 1.1rem; margin-top: 12px; outline: none; }
        .input-field:focus { border-color: var(--primary); }

        /* Modes Grid */
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
        .mode-card { background: var(--bg); border: 2px solid var(--border); padding: 16px; border-radius: 10px; text-align: center; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .mode-card:hover { border-color: var(--primary); }

        /* Flashcard 3D */
        .flashcard-box { perspective: 1000px; height: 200px; margin: 20px 0; cursor: pointer; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard-box.flipped .flashcard-inner { transform: rotateY(180deg); }
        .fc-front, .fc-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius); border: 2px solid var(--border); background: var(--bg); display: flex; justify-content: center; align-items: center; font-size: 1.8rem; font-weight: 800; padding: 20px; }
        .fc-back { transform: rotateY(180deg); color: var(--secondary); border-color: var(--primary); }

        /* Quiz Grid */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
        .opt-btn { background: var(--bg); border: 2px solid var(--border); color: white; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; text-align: left; }
        .opt-btn.correct { border-color: var(--secondary); background: rgba(16, 185, 129, 0.2); }
        .opt-btn.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.2); }

        /* Matching Grid */
        .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
        .match-card { background: var(--bg); border: 2px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; cursor: pointer; }
        .match-card.selected { border-color: #f59e0b; background: rgba(245, 158, 11, 0.15); }
        .match-card.matched { border-color: var(--secondary); opacity: 0.3; pointer-events: none; }

        .feedback { margin-top: 12px; font-weight: 700; text-align: center; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo">⚡ StudyGo Master</div>
        <button id="exit-btn" class="btn btn-outline hidden" style="width: auto; padding: 6px 12px;" onclick="app.showMenu()">Menu</button>
    </div>

    <!-- EKRAN MENU -->
    <div id="screen-menu">
        <h2 style="margin-bottom: 6px;">Wybierz tryb nauki</h2>
        <p style="color: var(--text-sub); font-size: 0.9rem;">Powtarzaj słówka tak długo, aż opanujesz wszystkie!</p>
        
        <div class="mode-grid">
            <div class="mode-card" onclick="app.startMode('flashcards')">🎴 Fiszki</div>
            <div class="mode-card" onclick="app.startMode('quiz')">❓ Quiz</div>
            <div class="mode-card" onclick="app.startMode('typing')">✍️ Wpisz Słówko</div>
            <div class="mode-card" onclick="app.startMode('dictation')">🎧 Dyktando</div>
            <div class="mode-card" style="grid-column: span 2;" onclick="app.startMode('matching')">🧩 Łączenie Par</div>
        </div>
    </div>

    <!-- EKRAN TRENINGU -->
    <div id="screen-trainer" class="hidden">
        <div class="progress-box">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-sub);">
                <span>Postęp lekcji</span>
                <span id="queue-count">Pozostało: 0</span>
            </div>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        </div>

        <!-- TRYB: FISZKI -->
        <div id="view-flashcards" class="hidden">
            <div class="flashcard-box" id="fc-box" onclick="this.classList.toggle('flipped')">
                <div class="flashcard-inner">
                    <div class="fc-front" id="fc-word">Word</div>
                    <div class="fc-back" id="fc-trans">Tłumaczenie</div>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-danger" onclick="app.handleAnswer(false)">Do powtórki ✕</button>
                <button class="btn btn-success" onclick="app.handleAnswer(true)">Umiem ✓</button>
            </div>
        </div>

        <!-- TRYB: QUIZ -->
        <div id="view-quiz" class="hidden">
            <h3 id="quiz-word" style="font-size: 1.8rem; text-align: center; margin: 20px 0;">Word</h3>
            <div class="options-grid" id="quiz-options"></div>
        </div>

        <!-- TRYB: WPISYWANIE -->
        <div id="view-typing" class="hidden">
            <h3 id="typing-prompt" style="font-size: 1.5rem; text-align: center; margin-top: 10px;">Polski</h3>
            <input type="text" id="typing-input" class="input-field" placeholder="Wpisz po angielsku..." autocomplete="off">
            <div id="typing-feedback" class="feedback"></div>
            <button class="btn" style="margin-top: 12px;" onclick="app.checkTyping()">Sprawdź</button>
        </div>

        <!-- TRYB: DYKTANDO -->
        <div id="view-dictation" class="hidden">
            <div style="text-align: center; margin: 20px 0;">
                <button class="btn btn-outline" style="width: auto; padding: 12px 24px;" onclick="app.speakCurrent()">🔊 Odtwórz dźwięk</button>
            </div>
            <input type="text" id="dictation-input" class="input-field" placeholder="Wpisz ze słuchu..." autocomplete="off">
            <div id="dictation-feedback" class="feedback"></div>
            <button class="btn" style="margin-top: 12px;" onclick="app.checkDictation()">Sprawdź</button>
        </div>

        <!-- TRYB: ŁĄCZENIE PAR -->
        <div id="view-matching" class="hidden">
            <div class="match-grid" id="matching-box"></div>
        </div>
    </div>

    <!-- EKRAN SUKCESU -->
    <div id="screen-summary" class="hidden" style="text-align: center; padding: 20px 0;">
        <div style="font-size: 4rem; margin-bottom: 10px;">🎉</div>
        <h2>Świetnie! Zestaw zaliczony!</h2>
        <p style="color: var(--text-sub); margin: 10px 0 20px 0;">Wszystkie słówka zostały poprawnie opanowane.</p>
        <button class="btn" onclick="app.showMenu()">Wróć do menu</button>
    </div>
</div>

<script>
    // Baza słówek do nauki
    const WORD_SET = [
        { id: 1, word: "Apple", trans: "Jabłko" },
        { id: 2, word: "House", trans: "Dom" },
        { id: 3, word: "Dog", trans: "Pies" },
        { id: 4, word: "Book", trans: "Książka" },
        { id: 5, word: "Water", trans: "Woda" }
    ];

    class StudyGoApp {
        constructor() {
            this.mode = '';
            this.queue = [];
            this.initialSize = 0;
            this.selectedMatch = null;
            this.matchedCount = 0;
        }

        showMenu() {
            this.toggleScreens('screen-menu');
            document.getElementById('exit-btn').classList.add('hidden');
        }

        startMode(selectedMode) {
            this.mode = selectedMode;
            // Główna mechanika StudyGo: Kopia bazy, która zmniejsza się tylko przy dobrych odpowiedziach
            this.queue = [...WORD_SET].sort(() => Math.random() - 0.5);
            this.initialSize = this.queue.length;

            document.getElementById('exit-btn').classList.remove('hidden');
            this.toggleScreens('screen-trainer');
            this.nextQuestion();
        }

        toggleScreens(screenId) {
            ['screen-menu', 'screen-trainer', 'screen-summary'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        updateProgress() {
            const remaining = this.queue.length;
            const done = this.initialSize - remaining;
            const pct = (done / this.initialSize) * 100;

            document.getElementById('progress-fill').style.width = `${pct}%`;
            document.getElementById('queue-count').innerText = `Pozostało: ${remaining}`;
        }

        nextQuestion() {
            if (this.queue.length === 0 && this.mode !== 'matching') {
                this.toggleScreens('screen-summary');
                return;
            }

            this.updateProgress();

            // Ukryj wszystkie widoki
            ['flashcards', 'quiz', 'typing', 'dictation', 'matching'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
            });

            document.getElementById(`view-${this.mode}`).classList.remove('hidden');

            const current = this.queue[0];

            if (this.mode === 'flashcards') {
                document.getElementById('fc-box').classList.remove('flipped');
                document.getElementById('fc-word').innerText = current.word;
                document.getElementById('fc-trans').innerText = current.trans;
            } 
            else if (this.mode === 'quiz') {
                this.renderQuiz(current);
            } 
            else if (this.mode === 'typing') {
                document.getElementById('typing-prompt').innerText = current.trans;
                const input = document.getElementById('typing-input');
                input.value = '';
                input.disabled = false;
                document.getElementById('typing-feedback').innerText = '';
                input.focus();
            } 
            else if (this.mode === 'dictation') {
                const input = document.getElementById('dictation-input');
                input.value = '';
                input.disabled = false;
                document.getElementById('dictation-feedback').innerText = '';
                this.speakCurrent();
                input.focus();
            }
            else if (this.mode === 'matching') {
                this.renderMatching();
            }
        }

        // OBSŁUGA MECHANIKI POWTÓREK (MECHANIKA WRTS/STUDYGO)
        handleAnswer(isCorrect) {
            const current = this.queue.shift(); // Usuń z początku
            
            if (!isCorrect) {
                // JEŚLI BŁĄD: dodaj słówko na koniec kolejki (musi wrócić!)
                this.queue.push(current);
            }
            this.nextQuestion();
        }

        /* --- TRYB 2: QUIZ --- */
        renderQuiz(current) {
            document.getElementById('quiz-word').innerText = current.word;
            const container = document.getElementById('quiz-options');
            container.innerHTML = '';

            let options = [current.trans];
            while (options.length < 4 && options.length < WORD_SET.length) {
                let rand = WORD_SET[Math.floor(Math.random() * WORD_SET.length)].trans;
                if (!options.includes(rand)) options.push(rand);
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    const isCorrect = (opt === current.trans);
                    btn.classList.add(isCorrect ? 'correct' : 'wrong');
                    setTimeout(() => this.handleAnswer(isCorrect), 800);
                };
                container.appendChild(btn);
            });
        }

        /* --- TRYB 3: WPISYWANIE --- */
        checkTyping() {
            const current = this.queue[0];
            const input = document.getElementById('typing-input');
            const feedback = document.getElementById('typing-feedback');
            const isCorrect = input.value.trim().toLowerCase() === current.word.toLowerCase();

            input.disabled = true;
            if (isCorrect) {
                feedback.style.color = "var(--secondary)";
                feedback.innerText = "✓ Dobrze!";
            } else {
                feedback.style.color = "var(--danger)";
                feedback.innerText = `✕ Błąd! Poprawnie: ${current.word}`;
            }
            setTimeout(() => this.handleAnswer(isCorrect), 1200);
        }

        /* --- TRYB 4: DYKTANDO --- */
        speakCurrent() {
            if (!this.queue[0]) return;
            const utterance = new SpeechSynthesisUtterance(this.queue[0].word);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        checkDictation() {
            const current = this.queue[0];
            const input = document.getElementById('dictation-input');
            const feedback = document.getElementById('dictation-feedback');
            const isCorrect = input.value.trim().toLowerCase() === current.word.toLowerCase();

            input.disabled = true;
            if (isCorrect) {
                feedback.style.color = "var(--secondary)";
                feedback.innerText = "✓ Dobrze!";
            } else {
                feedback.style.color = "var(--danger)";
                feedback.innerText = `✕ Poprawnie: ${current.word}`;
            }
            setTimeout(() => this.handleAnswer(isCorrect), 1200);
        }

        /* --- TRYB 5: ŁĄCZENIE PAR --- */
        renderMatching() {
            const container = document.getElementById('matching-box');
            container.innerHTML = '';
            this.selectedMatch = null;
            this.matchedCount = 0;

            let cards = [];
            WORD_SET.forEach(item => {
                cards.push({ id: item.id, text: item.word, type: 'word' });
                cards.push({ id: item.id, text: item.trans, type: 'trans' });
            });
            cards.sort(() => Math.random() - 0.5);

            cards.forEach(c => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerText = c.text;
                card.onclick = () => this.handleMatchClick(card, c);
                container.appendChild(card);
            });
        }

        handleMatchClick(cardEl, data) {
            if (cardEl.classList.contains('matched') || cardEl.classList.contains('selected')) return;

            if (!this.selectedMatch) {
                this.selectedMatch = { cardEl, data };
                cardEl.classList.add('selected');
            } else {
                const prev = this.selectedMatch;
                if (prev.data.id === data.id && prev.data.type !== data.type) {
                    cardEl.classList.add('matched');
                    prev.cardEl.classList.add('matched');
                    this.matchedCount++;
                    if (this.matchedCount === WORD_SET.length) {
                        setTimeout(() => this.toggleScreens('screen-summary'), 600);
                    }
                } else {
                    cardEl.classList.add('selected');
                    setTimeout(() => {
                        cardEl.classList.remove('selected');
                        prev.cardEl.classList.remove('selected');
                    }, 400);
                }
                this.selectedMatch = null;
            }
        }
    }

    const app = new StudyGoApp();
</script>
</body>
</html>
